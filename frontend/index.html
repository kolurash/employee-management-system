
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LOGIN PAGE -->
    <div id="loginPage" class="login-container">

        <div class="login-card">

            <h1>Employee Management</h1>

            <p>Login to your account</p>

            <form id="loginForm">

                <input type="email"
                       id="email"
                       placeholder="Email"
                       required>

                <input type="password"
                       id="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="loginMessage"></p>

        </div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" hidden>

        <!-- HEADER -->
        <header>

            <h2>Employee Management System</h2>

            <div>

                <span id="userInfo"></span>

                <button type="button" onclick="logout()">
                    Logout
                </button>

            </div>

        </header>


        <main>

            <!-- STATISTICS -->
            <section class="stats">

                <div class="stat-card">

                    <h3>Total Employees</h3>

                    <p id="totalEmployees">0</p>

                </div>

                <div class="stat-card">

                    <h3>Active Employees</h3>

                    <p id="activeEmployees">0</p>

                </div>

                <div class="stat-card">

                    <h3>Inactive Employees</h3>

                    <p id="inactiveEmployees">0</p>

                </div>

            </section>


            <!-- EMPLOYEE SECTION -->
            <section class="employee-section">

                <!-- SECTION HEADER -->
                <div class="section-header">

                    <h2>Employees</h2>

                    <button type="button"
                            id="addEmployeeBtn"
                            onclick="showForm()">

                        + Add Employee

                    </button>

                </div>


                <!-- EMPLOYEE FILTERS -->
                <div class="filters">

                    <!-- Search -->
                    <input type="text"
                           id="search"
                           placeholder="Search employees..."
                           oninput="loadEmployees()">


                    <!-- Department -->
                    <select id="departmentFilter"
                            onchange="loadEmployees()">

                        <option value="">All Departments</option>

                        <option value="1">IT</option>

                        <option value="2">HR</option>

                        <option value="3">Finance</option>

                        <option value="4">Sales</option>

                        <option value="5">Admin</option>

                    </select>


                    <!-- Status -->
                    <select id="statusFilter"
                            onchange="loadEmployees()">

                        <option value="">All Status</option>

                        <option value="ACTIVE">Active</option>

                        <option value="INACTIVE">Inactive</option>

                    </select>


                    <!-- Role -->
                    <input type="number"
                           id="roleFilter"
                           placeholder="Role ID"
                           min="1"
                           oninput="loadEmployees()">


                    <!-- Gender -->
                    <select id="genderFilter"
                            onchange="loadEmployees()">

                        <option value="">All Genders</option>

                        <option value="MALE">Male</option>

                        <option value="FEMALE">Female</option>

                        <option value="OTHER">Other</option>

                    </select>


                    <!-- Joining Date From -->
                    <label for="joiningDateFrom">
                        Joining From
                    </label>

                    <input type="date"
                           id="joiningDateFrom"
                           onchange="loadEmployees()">


                    <!-- Joining Date To -->
                    <label for="joiningDateTo">
                        Joining To
                    </label>

                    <input type="date"
                           id="joiningDateTo"
                           onchange="loadEmployees()">


                    <!-- Minimum Salary -->
                    <input type="number"
                           id="minSalary"
                           placeholder="Minimum Salary"
                           min="0"
                           oninput="loadEmployees()">


                    <!-- Maximum Salary -->
                    <input type="number"
                           id="maxSalary"
                           placeholder="Maximum Salary"
                           min="0"
                           oninput="loadEmployees()">


                    <!-- Clear Filters -->
                    <button type="button"
                            onclick="clearFilters()">

                        Clear Filters

                    </button>

                </div>


                <!-- EMPLOYEE FORM -->
                <div id="employeeFormContainer" hidden>

                    <h3 id="formTitle">
                        Add Employee
                    </h3>


                    <form id="employeeForm">

                        <input type="hidden"
                               id="employeeId">


                        <!-- FULL NAME -->
                        <input type="text"
                               id="fullName"
                               placeholder="Full Name"
                               minlength="3"
                               maxlength="100"
                               required>


                        <!-- EMAIL -->
                        <input type="email"
                               id="employeeEmail"
                               placeholder="Email"
                               required>


                        <!-- MOBILE -->
                        <input type="text"
                               id="mobile"
                               placeholder="10-digit Mobile"
                               pattern="[6-9][0-9]{9}"
                               maxlength="10"
                               inputmode="numeric"
                               required>


                        <!-- AADHAAR -->
                        <input type="text"
                               id="aadhaarNumber"
                               placeholder="12-digit Aadhaar Number"
                               pattern="[0-9]{12}"
                               maxlength="12"
                               inputmode="numeric"
                               required>


                        <!-- PAN -->
                        <input type="text"
                               id="panNumber"
                               placeholder="PAN Number (ABCDE1234F)"
                               pattern="[A-Z]{5}[0-9]{4}[A-Z]"
                               maxlength="10"
                               style="text-transform: uppercase;"
                               required>


                        <!-- DATE OF BIRTH -->
                        <label for="dateOfBirth">
                            Date of Birth
                        </label>

                        <input type="date"
                               id="dateOfBirth"
                               required>


                        <!-- GENDER -->
                        <select id="gender"
                                required>

                            <option value="">
                                Select Gender
                            </option>

                            <option value="MALE">
                                Male
                            </option>

                            <option value="FEMALE">
                                Female
                            </option>

                            <option value="OTHER">
                                Other
                            </option>

                        </select>


                        <!-- ADDRESS -->
                        <textarea id="address"
                                  placeholder="Enter Address"
                                  minlength="5"
                                  maxlength="250"
                                  required></textarea>


                        <!-- DEPARTMENT -->
                        <select id="departmentId"
                                required>

                            <option value="">
                                Select Department
                            </option>

                            <option value="1">IT</option>

                            <option value="2">HR</option>

                            <option value="3">Finance</option>

                            <option value="4">Sales</option>

                            <option value="5">Admin</option>

                        </select>


                        <!-- ROLE -->
                        <input type="number"
                               id="roleId"
                               placeholder="Role ID"
                               min="1"
                               required>


                        <!-- JOINING DATE -->
                        <label for="joiningDate">
                            Joining Date
                        </label>

                        <input type="date"
                               id="joiningDate"
                               required>


                        <!-- SALARY -->
                        <input type="number"
                               id="annualSalary"
                               placeholder="Annual Salary"
                               min="1"
                               required>


                        <!-- STATUS -->
                        <select id="employeeStatus"
                                required>

                            <option value="ACTIVE">
                                Active
                            </option>

                            <option value="INACTIVE">
                                Inactive
                            </option>

                        </select>


                        <!-- SAVE -->
                        <button type="submit">
                            Save Employee
                        </button>


                        <!-- CANCEL -->
                        <button type="button"
                                onclick="hideForm()">

                            Cancel

                        </button>

                    </form>

                </div>


                <!-- MESSAGE -->
                <p id="message"></p>


                <!-- EMPLOYEE TABLE -->
                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th onclick="sortEmployees('employeeId')">
                                    ID
                                </th>

                                <th>
                                    Code
                                </th>

                                <th onclick="sortEmployees('fullName')">
                                    Name
                                </th>

                                <th onclick="sortEmployees('email')">
                                    Email
                                </th>

                                <th>
                                    Mobile
                                </th>

                                <th>
                                    Department
                                </th>

                                <th onclick="sortEmployees('annualSalary')">
                                    Salary
                                </th>

                                <th onclick="sortEmployees('employeeStatus')">
                                    Status
                                </th>

                                <th>
                                    Actions
                                </th>

                            </tr>

                        </thead>

                        <tbody id="employeeTable">

                        </tbody>

                    </table>

                </div>


                <!-- PAGINATION -->
                <div class="pagination">

                    <button type="button"
                            onclick="previousPage()">

                        Previous

                    </button>

                    <span id="pageInfo">
                        Page 1
                    </span>

                    <button type="button"
                            onclick="nextPage()">

                        Next

                    </button>

                </div>

            </section>

        </main>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
